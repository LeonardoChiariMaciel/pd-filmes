<!DOCTYPE html:5">
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="lista.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <title>Minha Lista de Filmes</title>
</head>

<body>
    <header>
        <h1>Lista de Filmes</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="listas.html">Minha Lista</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="listas">

            <h2>Filmes para Assistir mais tarde</h2>
            
            <ul id="minha-lista">


      
            </ul>
        </section>
    </main>
  <script>
  window.onload = function() {
      let lista = JSON.parse(localStorage.getItem('minhaLista')) || [];
      const ul = document.getElementById('minha-lista');
      lista.forEach(filme => {
          const li = document.createElement('li');
          li.innerHTML = filme.html;
          const botao = li.querySelector('button');
          if (botao) botao.remove();
          ul.appendChild(li);
      });
  };
  </script>
</body>

</html>
